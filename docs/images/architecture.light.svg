<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560">
  <style>
    :root {
    --bg: #f8fafc;
    --bg-grid: #e2e8f0;
    --mask: #f8fafc;
    --text: #0f172a;
    --text-muted: #475569;
    --arrow: #64748b;
    --color-primary-fill: rgba(6,182,212,0.12);
    --color-primary-stroke: #0891b2;
    --color-secondary-fill: rgba(5,150,105,0.12);
    --color-secondary-stroke: #059669;
    --color-tertiary-fill: rgba(124,58,237,0.12);
    --color-tertiary-stroke: #7c3aed;
    --color-accent-fill: rgba(217,119,6,0.12);
    --color-accent-stroke: #d97706;
    --color-alert-fill: rgba(225,29,72,0.12);
    --color-alert-stroke: #e11d48;
    --color-connector-fill: rgba(234,88,12,0.12);
    --color-connector-stroke: #ea580c;
    --color-neutral-fill: rgba(100,116,139,0.12);
    --color-neutral-stroke: #64748b;
    --color-highlight-fill: rgba(59,130,246,0.12);
    --color-highlight-stroke: #3b82f6;
}
    text {
      font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Noto Sans SC', 'PingFang SC', sans-serif;
    }
    .title { font-size: 16px; font-weight: 700; fill: var(--text); }
    .subtitle { font-size: 10px; font-weight: 400; fill: var(--text-muted); }
    .group-label { font-size: 10px; font-weight: 700; fill: var(--text-muted); letter-spacing: 0.5px; }
    .node-title { font-size: 11.5px; font-weight: 600; fill: var(--text); }
    .node-sub { font-size: 9px; font-weight: 400; fill: var(--text-muted); }
    .edge-label { font-size: 8px; font-weight: 500; fill: var(--text-muted); }
    .legend-text { font-size: 9px; font-weight: 500; fill: var(--text-muted); }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
    </marker>
    <marker id="arrow-primary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-primary-stroke)"/>
    </marker>
    <marker id="arrow-connector" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-connector-stroke)"/>
    </marker>
    <marker id="arrow-secondary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-secondary-stroke)"/>
    </marker>
    <marker id="arrow-tertiary" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-tertiary-stroke)"/>
    </marker>
  </defs>

  <!-- Layer 1: Background + Grid -->
  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Layer 2: Group Boundaries -->
  <rect x="30" y="84" width="236" height="390" rx="10" fill="none" stroke="var(--color-primary-stroke)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="44" y="104" class="group-label">HOSTS &amp; CLIENTS</text>

  <rect x="316" y="84" width="318" height="390" rx="10" fill="none" stroke="var(--color-connector-stroke)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="330" y="104" class="group-label">MCP BRIDGE (antigravity-codex-bridge)</text>

  <rect x="684" y="84" width="266" height="390" rx="10" fill="none" stroke="var(--color-tertiary-stroke)" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
  <text x="698" y="104" class="group-label">CODEX RUNTIME &amp; SHARED STORAGE</text>

  <!-- Layer 3: Connection Arrows -->
  <!-- Antigravity -> MCP Tools -->
  <path d="M 246 154 L 338 154" fill="none" stroke="var(--color-primary-stroke)" stroke-width="1.6" marker-end="url(#arrow-primary)"/>
  <path d="M 246 164 L 284 164 L 284 242 L 338 242" fill="none" stroke="var(--color-primary-stroke)" stroke-width="1.4" marker-end="url(#arrow-primary)"/>
  <path d="M 246 174 L 274 174 L 274 328 L 338 328" fill="none" stroke="var(--color-primary-stroke)" stroke-width="1.4" marker-end="url(#arrow-primary)"/>
  <rect x="255" y="138" width="54" height="14" rx="3" fill="var(--mask)"/>
  <text x="282" y="148" text-anchor="middle" class="edge-label">MCP stdio</text>

  <!-- codex_app_turn <-> Codex App Server -->
  <path d="M 608 154 L 702 154" fill="none" stroke="var(--color-connector-stroke)" stroke-width="1.8" marker-end="url(#arrow-connector)"/>
  <rect x="618" y="136" width="76" height="14" rx="3" fill="var(--mask)"/>
  <text x="656" y="146" text-anchor="middle" class="edge-label">JSON-RPC v2</text>

  <!-- App Server -> Shared Storage -->
  <path d="M 817 198 L 817 242" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="1.5" marker-end="url(#arrow-secondary)"/>
  <path d="M 896 198 L 896 352" fill="none" stroke="var(--color-secondary-stroke)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-secondary)"/>
  <rect x="765" y="212" width="104" height="14" rx="3" fill="var(--mask)"/>
  <text x="817" y="222" text-anchor="middle" class="edge-label">source='vscode'</text>

  <!-- Storage -> list/read tools -->
  <path d="M 708 278 L 616 248" fill="none" stroke="var(--color-tertiary-stroke)" stroke-width="1.5" marker-end="url(#arrow-tertiary)"/>
  <path d="M 708 386 L 656 386 L 656 334 L 616 334" fill="none" stroke="var(--color-tertiary-stroke)" stroke-width="1.5" marker-end="url(#arrow-tertiary)"/>
  <rect x="626" y="264" width="60" height="14" rx="3" fill="var(--mask)"/>
  <text x="656" y="274" text-anchor="middle" class="edge-label">RO Query</text>

  <!-- Codex Desktop & CLI <-> Shared Storage (bottom routing) -->
  <path d="M 151 312 L 151 334 L 292 334 L 292 490 L 817 490 L 817 434" fill="none" stroke="var(--arrow)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M 151 426 L 151 490" fill="none" stroke="var(--arrow)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="440" y="482" width="210" height="15" rx="3" fill="var(--mask)"/>
  <text x="545" y="493" text-anchor="middle" class="edge-label">Native Reload / codex resume &lt;thread_id&gt;</text>

  <!-- Layer 4 & 5: Opaque Mask Rects + Component Boxes -->
  <!-- Host: Antigravity -->
  <rect x="52" y="124" width="194" height="68" rx="8" fill="var(--mask)"/>
  <rect x="52" y="124" width="194" height="68" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="149" y="152" text-anchor="middle" class="node-title">Antigravity Agent</text>
  <text x="149" y="170" text-anchor="middle" class="node-sub">PM / Dispatcher / Reviewer</text>

  <!-- Host: Codex Desktop -->
  <rect x="52" y="244" width="194" height="68" rx="8" fill="var(--mask)"/>
  <rect x="52" y="244" width="194" height="68" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="149" y="272" text-anchor="middle" class="node-title">Codex Desktop (GUI)</text>
  <text x="149" y="290" text-anchor="middle" class="node-sub">Sidebar Native Sync (vscode)</text>

  <!-- Host: Codex CLI -->
  <rect x="52" y="358" width="194" height="68" rx="8" fill="var(--mask)"/>
  <rect x="52" y="358" width="194" height="68" rx="8" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="149" y="386" text-anchor="middle" class="node-title">Codex CLI</text>
  <text x="149" y="404" text-anchor="middle" class="node-sub">codex resume &lt;thread_id&gt;</text>

  <!-- MCP: codex_app_turn -->
  <rect x="340" y="124" width="268" height="68" rx="8" fill="var(--mask)"/>
  <rect x="340" y="124" width="268" height="68" rx="8" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.5"/>
  <text x="474" y="152" text-anchor="middle" class="node-title">codex_app_turn</text>
  <text x="474" y="170" text-anchor="middle" class="node-sub">thread/start · thread/resume · turn/start</text>

  <!-- MCP: codex_list_threads -->
  <rect x="340" y="212" width="268" height="68" rx="8" fill="var(--mask)"/>
  <rect x="340" y="212" width="268" height="68" rx="8" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.5"/>
  <text x="474" y="240" text-anchor="middle" class="node-title">codex_list_threads</text>
  <text x="474" y="258" text-anchor="middle" class="node-sub">Filter by cwd (\\?\ normalized) &amp; source</text>

  <!-- MCP: codex_read_thread -->
  <rect x="340" y="300" width="268" height="68" rx="8" fill="var(--mask)"/>
  <rect x="340" y="300" width="268" height="68" rx="8" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.5"/>
  <text x="474" y="328" text-anchor="middle" class="node-title">codex_read_thread</text>
  <text x="474" y="346" text-anchor="middle" class="node-sub">thread/read + rollout JSONL fallback</text>

  <!-- MCP: codex (Legacy) -->
  <rect x="340" y="392" width="268" height="58" rx="8" fill="var(--mask)"/>
  <rect x="340" y="392" width="268" height="58" rx="8" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.3"/>
  <text x="474" y="417" text-anchor="middle" class="node-title">codex (Legacy Exec)</text>
  <text x="474" y="434" text-anchor="middle" class="node-sub">codex exec --json (100% compatible)</text>

  <!-- Runtime: codex app-server -->
  <rect x="708" y="124" width="218" height="74" rx="8" fill="var(--mask)"/>
  <rect x="708" y="124" width="218" height="74" rx="8" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="817" y="154" text-anchor="middle" class="node-title">codex.exe app-server</text>
  <text x="817" y="172" text-anchor="middle" class="node-sub">Standalone Runtime (No GUI needed)</text>

  <!-- Storage: state_5.sqlite -->
  <rect x="708" y="244" width="218" height="68" rx="8" fill="var(--mask)"/>
  <rect x="708" y="244" width="218" height="68" rx="8" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="817" y="272" text-anchor="middle" class="node-title">~/.codex/state_5.sqlite</text>
  <text x="817" y="290" text-anchor="middle" class="node-sub">threads table (id, cwd, source, title)</text>

  <!-- Storage: sessions/*.jsonl -->
  <rect x="708" y="356" width="218" height="74" rx="8" fill="var(--mask)"/>
  <rect x="708" y="356" width="218" height="74" rx="8" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="817" y="386" text-anchor="middle" class="node-title">~/.codex/sessions/*.jsonl</text>
  <text x="817" y="404" text-anchor="middle" class="node-sub">Chronological Rollout Transcripts</text>

  <!-- Layer 7: Legend -->
  <g transform="translate(30, 520)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.2"/>
    <text x="18" y="10" class="legend-text">Host Agents &amp; UI</text>

    <rect x="140" y="0" width="12" height="12" rx="3" fill="var(--color-connector-fill)" stroke="var(--color-connector-stroke)" stroke-width="1.2"/>
    <text x="158" y="10" class="legend-text">MCP Bridge Tools</text>

    <rect x="285" y="0" width="12" height="12" rx="3" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.2"/>
    <text x="303" y="10" class="legend-text">Codex Runtime</text>

    <rect x="415" y="0" width="12" height="12" rx="3" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.2"/>
    <text x="433" y="10" class="legend-text">Shared Local Storage</text>
  </g>

  <!-- Layer 8: Title Block -->
  <text x="30" y="38" class="title">Antigravity &lt;-&gt; Codex Bidirectional Bridge Architecture</text>
  <text x="30" y="56" class="subtitle">MCP Server + codex app-server (JSON-RPC v2) + Shared SQLite &amp; Rollout Storage</text>
</svg>
